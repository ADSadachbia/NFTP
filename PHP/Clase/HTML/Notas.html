<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Notas</title>
    <style>
        /* Estilos CSS para el diseño de la página */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Notas</h1>
    <form id="notaForm">
        <label>Ingresa las 10 notas (separadas por comas):</label>
        <input type="text" id="notasInput" required>
        <input type="submit" value="Calcular">
    </form>
    <p id="resultado"></p>

    <script src="JS/Notas.js"></script>
</body>
</html>
