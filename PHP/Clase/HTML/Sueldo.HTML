<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Sueldos</title>
    <link rel="stylesheet" href="Sueldo.css">
</head>
<body>
    <h1>Calculadora de Sueldos</h1>
    <form id="sueldosForm">
        <label>Ingresa el Sueldo 1:</label>
        <input type="text" name="sueldo1" required>
        <br>
        <label>Ingresa el Sueldo 2:</label>
        <input type="text" name="sueldo2" required>
        <br>
        <label>Ingresa el Sueldo 3:</label>
        <input type="text" name="sueldo3" required>
        <br>
        <label>Ingresa el Sueldo 4:</label>
        <input type="text" name="sueldo4" required>
        <br>
        <label>Ingresa el Sueldo 5:</label>
        <input type="text" name="sueldo5" required>
        <br>
        <input type="submit" value="Calcular">
    </form>
    <div id="resultado"></div>

    <script src="JS/Sueldo.js"></script>
</body>
</html>
